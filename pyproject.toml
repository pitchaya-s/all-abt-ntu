[project]
name = "all-abt-ntu-mcp"
version = "0.1.0-beta.6"
description = "CLI and MCP interfaces for NTU schedules, learning, career opportunities, maps, research, faculty, library, news, campus services, shuttle arrivals, and student administration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pitchaya-s" }]
keywords = ["ntu", "mcp", "stars", "ntulearn", "shuttle", "omnibus", "careeraxis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
]
requires-python = ">=3.10"
dependencies = [
    "anyio>=4,<5",
    "pydantic>=2.11,<3",
    "typing-extensions>=4.12,<5",
    "pypdf>=6.21.4,<7",
    "keyring>=25.6,<27",
    "httpx>=0.27,<1",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
cli = ["click>=8,<9", "questionary>=2.1,<3", "typer>=0.12,<1", "rich>=13,<15", "tomlkit>=0.13,<1", "json-five>=1.1.2,<2"]
mcp = ["mcp>=2,<3", "starlette>=0.48,<2"]
personal = ["playwright>=1.50,<2"]
browser-cookies = ["browser-cookie3>=0.20,<1"]

[dependency-groups]
dev = ["all-abt-ntu-mcp[cli]"]
hosted = ["all-abt-ntu-mcp[mcp]"]

[tool.uv]
default-groups = ["dev", "hosted"]

[project.urls]
Homepage = "https://github.com/pitchaya-s/all-abt-ntu"
Repository = "https://github.com/pitchaya-s/all-abt-ntu"
Documentation = "https://pitchaya-s.github.io/all-abt-ntu/"
Issues = "https://github.com/pitchaya-s/all-abt-ntu/issues"

[project.scripts]
ntu = "cli.entrypoint:main"

[tool.hatch.build]
exclude = [
    "**/.env",
    "**/.env.*",
    "**/*.har",
    "**/cookies*.json",
    "**/storage_state*.json",
    "**/*.log",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "src/careeraxis",
    "src/cli",
    "src/drntu",
    "src/faculty",
    "src/library",
    "src/mazemap",
    "src/news",
    "src/ntulearn",
    "src/omnibus",
    "src/onestop",
    "src/service",
    "src/shared",
    "src/stars",
    "src/application.py",
    "src/server.py",
    "src/public_server.py",
    "src/public_http_server.py",
    "src/public_http_client.py",
]
sources = ["src"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
